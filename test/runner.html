<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>BloodTrace Unit Tests</title></head>
<body>
<div id="log" style="font-family: monospace; white-space: pre;"></div>
<script>
  window.process = {
    exit: function(code) {
      const status = code === 0 ? 'ALL_TESTS_PASSED' : 'TESTS_FAILED';
      document.getElementById('log').textContent += '\n' + status;
    }
  };
  const origLog = console.log;
  console.log = function(...args) {
    origLog.apply(console, args);
    const div = document.getElementById('log');
    if (div) div.textContent += args.join(' ') + '\n';
  };
  const origErr = console.error;
  console.error = function(...args) {
    origErr.apply(console, args);
    const div = document.getElementById('log');
    if (div) div.textContent += 'ERROR: ' + args.join(' ') + '\n';
  };
</script>
<script type="module" src="./test-simulation.js"></script>
</body>
</html>
